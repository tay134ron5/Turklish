<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Turklish</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f5f7; font: 16px/1.5 system-ui, sans-serif; color: #1f2328; }
    main { width: min(560px, 100% - 32px); background: #fff; padding: 28px; border-radius: 14px; box-shadow: 0 4px 24px rgba(0,0,0,.06); }
    h1 { margin: 0 0 20px; font-size: 1.5rem; }
    textarea, select, button { font: inherit; border-radius: 8px; border: 1px solid #d0d7de; padding: 10px 12px; }
    textarea { width: 100%; min-height: 120px; resize: vertical; }
    .row { display: flex; gap: 10px; align-items: center; margin: 12px 0; }
    .row select { flex: 1; }
    button { background: #c8102e; color: #fff; border: 0; cursor: pointer; padding: 10px 20px; }
    button:disabled { opacity: .6; cursor: wait; }
    #result { min-height: 60px; padding: 12px; background: #f6f8fa; border-radius: 8px; white-space: pre-wrap; }
    #result.error { color: #c8102e; }
  </style>
</head>
<body>
  <main>
    <h1>Turklish</h1>
    <textarea id="text" placeholder="Enter text to translate..."></textarea>
    <div class="row">
      <select id="source" aria-label="Source language">
        <option value="en">English</option><option value="tr">Türkçe</option><option value="ru">Русский</option>
      </select>
      <span>→</span>
      <select id="target" aria-label="Target language">
        <option value="en">English</option><option value="tr" selected>Türkçe</option><option value="ru">Русский</option>
      </select>
      <button id="go">Translate</button>
    </div>
    <div id="result"></div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    $('go').onclick = async () => {
      const text = $('text').value.trim();
      if (!text) return;
      $('go').disabled = true;
      $('result').className = '';
      $('result').textContent = 'Translating...';
      try {
        const res = await fetch('/api/translate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, sourceLang: $('source').value, targetLang: $('target').value }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Request failed');
        $('result').textContent = data.translatedText;
      } catch (err) {
        $('result').className = 'error';
        $('result').textContent = err.message;
      } finally {
        $('go').disabled = false;
      }
    };
    $('text').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        $('go').click();
      }
    });
  </script>
</body>
</html>
